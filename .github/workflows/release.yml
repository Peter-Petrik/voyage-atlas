# Automated GitHub Release creation triggered by version tags.
#
# When a tag matching v* (e.g. v3.5.1) is pushed, this workflow first runs the
# test suite on the tagged commit and checks that the tag names the version both
# footers carry and the newest CHANGELOG entry, so a release cannot go out from
# an untested commit or with a version that does not match. Those checks run in
# their own job with read-only access. Only when they pass does a second job
# extract the matching version's section from CHANGELOG.md and create the GitHub
# Release with those notes. There is no build or publish step: the project is
# two self-contained HTML files with no package and no dependencies, so the only
# automated artifact is the Release entry itself.
#
# The Release is created with the GitHub CLI, which is preinstalled on
# GitHub-hosted runners, so no third-party action receives the write token, and
# neither job leaves the token in the checked-out repository. Authentication
# uses the default GITHUB_TOKEN that Actions provides. No stored secrets or
# tokens are required, and the workflow contains nothing installation-specific,
# so a self-hosting fork runs it unchanged.

name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The repository's test code runs here, with read access only.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run tests
        run: node --test test/*.test.js

      # The tag must name the version in both footers and the newest CHANGELOG
      # entry; a tag on the wrong commit or with a typo stops here. The footer
      # is matched as a fixed string, so the dots in the tag are only dots.
      - name: Check the tag against the version
        run: |
          TAG="${GITHUB_REF_NAME}"
          for f in voyage-atlas.html voyage-atlas-editor.html; do
            if ! grep -qF " ${TAG}</a>" "$f"; then
              echo "The footer of $f does not carry ${TAG}" >&2
              exit 1
            fi
          done
          NEWEST="$(grep -m1 -o '^## \[v[^]]*\]' CHANGELOG.md || true)"
          if [ "$NEWEST" != "## [${TAG}]" ]; then
            echo "The newest CHANGELOG entry is '${NEWEST}', not ${TAG}" >&2
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # contents: write is required to create a GitHub Release. No other
    # permission is needed; the default token grants the rest read-only.
    permissions:
      contents: write

    steps:
      # The full history and all tags are fetched so that the previous
      # version's tag can be found for the "Full changelog" link below. The
      # default checkout is a single commit with no tags.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Extract the release notes for the tagged version from CHANGELOG.md.
      #
      # CHANGELOG headers carry the v-prefix inside the brackets and a trailing
      # date, e.g. "## [v3.5.1] - 2026-06-10". The tag (GITHUB_REF_NAME) is the
      # full "v3.5.1", so it is matched verbatim with no prefix stripping.
      # index() does a literal substring match on "[v3.5.1]", which avoids
      # treating the brackets as a regex character class. awk captures every
      # line after the matched header until the next "## [" header (or EOF).
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v ver="$TAG" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          # Fail loudly rather than publishing an empty Release if the tag has
          # no matching CHANGELOG section (a missed entry or a header-format
          # drift). A silent empty body is worse than a failed run.
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for tag $TAG" >&2
            exit 1
          fi

          # Add a link to the comparison with the previous version: the
          # nearest v* tag in the history before the tagged commit. A first
          # release has none and gets no link.
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            echo "" >> release_notes.md
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}" >> release_notes.md
          fi

      # A Release that already exists for the tag (a re-run, or a tag moved
      # onto another commit) gets its title and notes updated instead.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release_notes.md --verify-tag
          fi
